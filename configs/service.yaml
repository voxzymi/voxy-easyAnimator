# Service settings (voxy_service.config.DEFAULTS has every key). Release builds set allow_stub_models: false.
service:
  host: 127.0.0.1
  port: 0
  allow_stub_models: true
models:
  root: models
  general: {backend: stub, version: "0.1.0"}     # change to onnx once models/general/<version>/model.onnx exists
  hair: {backend: stub, version: "0.1.0"}
  matting: {backend: algorithm, version: "0.1.0"}
  inpaint: {backend: patch, version: "0.1.0"}    # onnx when a large-mask model is installed
device: {prefer: cuda, cpu_fallback: true}
upscale:
  model: realesr-animevideov3-x2
  model_scale: 2
  scale: 2
