# Hair subdivision model: strand flow field + root points. Hair-specific data only.
model: {base: 24, depth: 4, input_size: 256}
train:
  epochs: 40
  batch_size: 8
  accum_steps: 2
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  workers: 4
  grad_clip: 1.0
  seed: 0
loss: {flow: 1.0, roots: 1.0, root_pos_weight: 20.0}
data:
  synthetic: [data/synthetic/train]
  val: [data/synthetic/val]
  labeled: data/labeled/hair
  images: data/raw
output: {checkpoints: out/hair}
export: {version: "0.1.0"}
